<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Gelistir - Ayarlar</title>
    <style>
      body { max-width: 520px; margin: 32px auto; padding: 0 16px; font: 14px/1.6 system-ui, sans-serif; color: #1c1c1c; }
      h1 { font-size: 18px; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 13px; }
      input { width: 100%; padding: 7px; font: inherit; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
      button { margin-top: 14px; padding: 8px 16px; font: inherit; background: #4a90d9; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
      .hint { color: #666; font-size: 12px; margin: 4px 0 0; }
      .msg { margin-top: 12px; font-size: 13px; }
      code { background: #f2f2f2; padding: 1px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>Gelistir ayarlari</h1>
    <p class="hint">
      Bu eklenti yalnizca kendi bilgisayarindaki <code>gelistir serve</code>
      surecine baglanir. Video ve dokum hicbir yere gonderilmez.
    </p>

    <label for="port">Cekirdek portu</label>
    <input id="port" type="number" min="1" max="65535" />
    <p class="hint">Varsayilan 8787. <code>gelistir serve</code> baslarken yazdirir.</p>

    <label for="token">Erisim token'i</label>
    <input id="token" type="password" />
    <p class="hint">
      <code>gelistir token</code> komutunun yazdirdigi deger
      (<code>~/.gelistir/token</code>).
    </p>

    <button id="save">Kaydet</button>
    <div id="msg" class="msg"></div>

    <script src="options.js"></script>
  </body>
</html>
